name: Refresh hero

on:
  schedule:
    - cron: "0 16 * * 0" # Sundays, midnight in Kuala Lumpur
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/render.mjs
      - name: Commit if the typing best changed
        run: |
          git diff --quiet assets && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh hero typing speed"
          git push
